<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title id="page-title">Quiz Escolar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#6C5CE7;--pd:#4834b8;--pl:#ede9ff;--g:#00b894;--r:#d63031;--b:#0984e3;--y:#fdcb6e;--text:#1a1a2e;--muted:#636e72;--card:#fff;--rad:20px;--rads:14px;}
body{font-family:'Nunito',sans-serif;background-color:#1a1040;min-height:100vh;color:var(--text);display:flex;justify-content:center;padding:1rem;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(-55deg,transparent 0px,transparent 38px,rgba(108,92,231,.07) 38px,rgba(108,92,231,.07) 40px,transparent 40px,transparent 78px,rgba(162,155,254,.04) 78px,rgba(162,155,254,.04) 80px);background-size:120px 120px;animation:stripeMove 8s linear infinite;}
body::after{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(108,92,231,.15) 0%,transparent 70%);z-index:0;pointer-events:none;animation:glowPulse 4s ease-in-out infinite;}
@keyframes stripeMove{0%{background-position:0 0}100%{background-position:120px 120px}}
@keyframes glowPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
#app{position:relative;z-index:1;width:100%;max-width:680px}
.screen{display:none}.screen.active{display:block}

/* Cards */
.card{background:rgba(255,255,255,.97);border-radius:var(--rad);padding:1.5rem;margin-bottom:1rem;box-shadow:0 8px 32px rgba(0,0,0,.35);}
.card-dark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--rad);padding:1.25rem;margin-bottom:1rem;backdrop-filter:blur(10px);}

/* Hero */
.hero{text-align:center;padding:2rem 0 1.5rem}
.hero-logo{width:90px;height:90px;object-fit:contain;border-radius:20px;margin-bottom:.75rem;box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.2);animation:popIn .6s cubic-bezier(.34,1.56,.64,1);display:block;margin-left:auto;margin-right:auto;}
.hero h1{font-size:22px;font-weight:900;color:#fff;margin-bottom:3px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero .subtitle{font-size:16px;font-weight:800;background:linear-gradient(90deg,#fdcb6e,#e17055,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.hero .tagline{font-size:13px;color:rgba(255,255,255,.6)}

/* Forms */
.tabs{display:flex;background:rgba(108,92,231,.1);border-radius:var(--rads);padding:4px;margin-bottom:1.25rem;gap:4px}
.tab{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:800;color:#8b86c0;cursor:pointer;transition:all .2s}
.tab.active{background:rgba(255,255,255,.95);color:var(--p);box-shadow:0 2px 10px rgba(0,0,0,.12)}
input[type=text],input[type=password]{width:100%;padding:13px 16px;border:2px solid rgba(108,92,231,.2);border-radius:var(--rads);font-family:inherit;font-size:15px;color:var(--text);background:#fafafe;margin-bottom:10px;outline:none;transition:border .2s,box-shadow .2s;}
input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(108,92,231,.12)}
.err{color:#ff7675;font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px}
.btn{display:block;width:100%;padding:15px;border-radius:var(--rads);font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;text-align:center;border:none;transition:all .2s;letter-spacing:.3px;}
.btn-primary{background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:#fff;box-shadow:0 6px 20px rgba(108,92,231,.5);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(108,92,231,.6)}
.btn-primary:disabled{background:#636e72;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-weight:700;}
.btn-ghost:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}
.btn+.btn{margin-top:8px}
.btn-sm{width:auto;padding:8px 18px;font-size:13px}

/* Topic selector */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:6px 14px 6px 8px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6C5CE7,#fd79a8);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;text-transform:uppercase;}
.user-name{font-size:14px;font-weight:800;color:#fff}
.filter-label{font-size:11px;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.pill{padding:7px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-family:inherit;font-size:13px;font-weight:700;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;}
.pill.active{background:linear-gradient(135deg,var(--p),#a29bfe);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(108,92,231,.4);}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.topic-section-title{font-size:12px;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem}
.topic-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:var(--rads);padding:1rem;cursor:pointer;transition:all .2s;text-align:left;position:relative;overflow:hidden;}
.topic-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(108,92,231,.4),rgba(162,155,254,.2));opacity:0;transition:opacity .2s;}
.topic-card:hover{transform:translateY(-3px);border-color:rgba(108,92,231,.6);box-shadow:0 8px 24px rgba(108,92,231,.3)}
.topic-card:hover::before{opacity:1}
.tc-num{font-size:11px;font-weight:800;color:rgba(255,255,255,.4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;position:relative}
.tc-name{font-size:14px;font-weight:800;color:#fff;line-height:1.3;position:relative}
.tc-score{font-size:12px;font-weight:700;color:#fdcb6e;margin-top:5px;position:relative}
.tc-qs{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px;position:relative}
.no-topics{text-align:center;padding:2.5rem;color:rgba(255,255,255,.4);font-size:14px}
.spinner-wrap{text-align:center;padding:2.5rem}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}

/* Game HUD */
.game-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;}
.hud-progress{font-size:13px;font-weight:700;color:rgba(255,255,255,.6)}
.hud-score{background:linear-gradient(135deg,#fdcb6e,#e17055);color:#fff;font-size:15px;font-weight:900;padding:5px 16px;border-radius:20px;box-shadow:0 4px 12px rgba(253,203,110,.3);min-width:80px;text-align:center;}
.timer-wrap{margin-bottom:1rem}
.timer-bar{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.timer-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#6C5CE7,#a29bfe);transition:width .1s linear;box-shadow:0 0 10px rgba(108,92,231,.6);}
.timer-fill.warning{background:linear-gradient(90deg,#e17055,#fdcb6e)}
.timer-secs{text-align:right;font-size:12px;font-weight:800;color:rgba(255,255,255,.5);margin-top:4px}

/* Question card */
.q-card{background:rgba(255,255,255,.97);border-radius:var(--rad);padding:1.5rem 1.5rem 1rem;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:slideUp .28s ease;}
.q-type-badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--pl);color:var(--pd);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.q-text{font-size:17px;font-weight:800;color:var(--text);line-height:1.45;margin-bottom:1rem}
.q-img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--rads);margin-bottom:1rem;border:2px solid rgba(108,92,231,.15);display:block}
.feedback{font-size:15px;font-weight:800;margin-top:1rem;min-height:24px;text-align:center;animation:popIn .3s ease}
.feedback.ok{color:#00b894}.feedback.ko{color:#d63031}

/* MCQ options */
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:.5rem}
.opt{padding:16px 14px;border-radius:var(--rads);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;border:none;transition:all .18s;text-align:left;line-height:1.4;color:#fff;position:relative;overflow:hidden;}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.opt:disabled{cursor:default}
.opt-a{background:linear-gradient(135deg,#6C5CE7,#a29bfe)}.opt-b{background:linear-gradient(135deg,#00b894,#00cec9)}
.opt-c{background:linear-gradient(135deg,#e17055,#d63031)}.opt-d{background:linear-gradient(135deg,#0984e3,#74b9ff)}
.opt.correct{outline:4px solid #00b894;transform:scale(1.04)!important;box-shadow:0 0 30px rgba(0,184,148,.6)!important}
.opt.wrong{opacity:.25;transform:scale(.95)!important;box-shadow:none!important}
.opt-letter{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.25);font-size:12px;font-weight:900;margin-right:8px;flex-shrink:0;vertical-align:middle;}

/* True/False */
.tf-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:.5rem}
.tf-btn{padding:22px;border-radius:var(--rads);font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;border:none;transition:all .2s;color:#fff;text-align:center;}
.tf-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tf-btn:disabled{cursor:default}
.tf-true{background:linear-gradient(135deg,#00b894,#00cec9)}
.tf-false{background:linear-gradient(135deg,#d63031,#e17055)}
.tf-btn.correct{outline:4px solid #27500A;transform:scale(1.05)!important}
.tf-btn.wrong{opacity:.25}

/* Match (flechas) */
.match-wrap{display:flex;flex-direction:column;gap:0;margin-top:.5rem;position:relative}
.match-cols{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:start}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-item{padding:10px 14px;border-radius:var(--rads);border:2px solid #e0dcf7;background:#fafafe;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;text-align:center;user-select:none;}
.match-item:hover{border-color:var(--p);background:var(--pl)}
.match-item.selected{border-color:var(--p);background:var(--p);color:#fff;transform:scale(1.03)}
.match-item.matched-ok{border-color:#00b894;background:#e8f5e9;color:#1b5e20;cursor:default}
.match-item.matched-err{border-color:#d63031;background:#fce4ec;color:#880e4f;animation:shake .3s ease}
.match-item.disabled{cursor:default}
.match-svg-col{position:relative;overflow:visible}
#match-svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none}

/* Order */
.order-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:.5rem}
.order-item{padding:12px 16px;border-radius:var(--rads);border:2px solid #e0dcf7;background:#fafafe;font-size:14px;font-weight:700;cursor:grab;transition:all .18s;display:flex;align-items:center;gap:10px;user-select:none;}
.order-item:active{cursor:grabbing}
.order-item.dragging{opacity:.4;border-color:var(--p)}
.order-item.drag-over{border-color:var(--p);background:var(--pl)}
.order-item.correct{border-color:#00b894;background:#e8f5e9}
.order-item.wrong{border-color:#d63031;background:#fce4ec}
.order-handle{color:#bbb;font-size:16px}
.btn-check-order{margin-top:1rem;width:100%;padding:13px;border-radius:var(--rads);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;border:none;background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:#fff;transition:all .18s;}
.btn-check-order:hover{transform:translateY(-1px)}
.btn-check-order:disabled{background:#aaa;cursor:not-allowed;transform:none}

/* Fill blank */
.fillblank-wrap{margin-top:.5rem;font-size:17px;font-weight:700;line-height:2.2;color:var(--text)}
.blank-input{display:inline-block;min-width:80px;max-width:160px;border:none;border-bottom:3px solid var(--p);background:transparent;font-family:inherit;font-size:16px;font-weight:800;color:var(--p);text-align:center;outline:none;padding:2px 6px;transition:border-color .2s;}
.blank-input:focus{border-color:var(--pd)}
.blank-input.correct{border-color:#00b894;color:#00b894}
.blank-input.wrong{border-color:#d63031;color:#d63031}
.btn-check-fill{margin-top:1rem;width:100%;padding:13px;border-radius:var(--rads);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;border:none;background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:#fff;transition:all .18s;}
.btn-check-fill:disabled{background:#aaa;cursor:not-allowed}

/* Hotspot */
.hotspot-wrap{position:relative;display:inline-block;width:100%;margin-top:.5rem}
.hotspot-wrap img{width:100%;border-radius:var(--rads);display:block;border:2px solid rgba(108,92,231,.15)}
.hotspot-overlay{position:absolute;inset:0;cursor:crosshair;border-radius:var(--rads)}
.hotspot-target{position:absolute;width:48px;height:48px;border-radius:50%;border:3px dashed rgba(108,92,231,.4);transform:translate(-50%,-50%);pointer-events:none;display:none}
.hotspot-click{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:popIn .3s ease}
.hotspot-click.ok{background:rgba(0,184,148,.8)}
.hotspot-click.ko{background:rgba(214,48,49,.8)}

/* Audio */
.audio-wrap{margin-top:.5rem}
.audio-player{width:100%;border-radius:var(--rads);margin-bottom:1rem}
audio{width:100%;border-radius:var(--rads)}

/* Math */
.math-wrap{margin-top:.5rem}
.math-problem{font-size:20px;font-weight:900;color:var(--text);text-align:center;padding:1rem;background:#f8f7ff;border-radius:var(--rads);margin-bottom:1rem;border:2px solid #e0dcf7}
.math-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.math-opt{padding:16px;border-radius:var(--rads);font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;border:2px solid #e0dcf7;background:#fafafe;color:var(--text);transition:all .18s;text-align:center;}
.math-opt:hover:not(:disabled){border-color:var(--p);background:var(--pl);transform:translateY(-2px)}
.math-opt:disabled{cursor:default}
.math-opt.correct{border-color:#00b894;background:#e8f5e9;color:#1b5e20}
.math-opt.wrong{border-color:#d63031;background:#fce4ec;color:#880e4f;opacity:.5}
.math-input{width:100%;padding:13px 16px;border:2px solid rgba(108,92,231,.2);border-radius:var(--rads);font-family:inherit;font-size:15px;color:var(--text);background:#fafafe;margin-bottom:10px;outline:none;transition:border .2s,box-shadow .2s;}

/* Lever */
.lever-wrap{margin-top:.5rem;text-align:center}
.lever-context{font-size:15px;color:var(--muted);margin-bottom:1rem;line-height:1.5;background:#f8f7ff;padding:1rem;border-radius:var(--rads);border:2px solid #e0dcf7}
.lever-emoji{font-size:56px;margin-bottom:.5rem;display:block;animation:popIn .4s ease}
.lever-buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:1rem}
.lever-btn{padding:18px;border-radius:var(--rads);font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;border:none;transition:all .2s;color:#fff;}
.lever-btn:hover:not(:disabled){transform:translateY(-3px)}
.lever-btn:disabled{cursor:default}
.lever-yes{background:linear-gradient(135deg,#00b894,#00cec9)}
.lever-no{background:linear-gradient(135deg,#d63031,#e17055)}
.lever-btn.correct{outline:4px solid #27500A;transform:scale(1.05)!important}
.lever-btn.wrong{opacity:.25}

/* Result */
.result-wrap{animation:slideUp .4s ease}
.result-hero{text-align:center;padding:1.5rem 0 1.25rem}
.result-emoji{font-size:72px;animation:popIn .6s cubic-bezier(.34,1.56,.64,1);display:block;margin-bottom:10px}
.result-score{font-size:62px;font-weight:900;background:linear-gradient(135deg,#fdcb6e,#e17055,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;display:block;}
.result-label{font-size:15px;color:rgba(255,255,255,.6);margin-top:8px;font-weight:700}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.stat-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--rads);padding:1rem;text-align:center;}
.stat-val{font-size:28px;font-weight:900;color:#fdcb6e;display:block}
.stat-lbl{font-size:12px;color:rgba(255,255,255,.5);font-weight:700;margin-top:2px;display:block}

        /* -- BURST -- */
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
.burst-piece{position:absolute;pointer-events:none;line-height:1;z-index:9999;animation:burst var(--dur,0.8s) var(--del,0s) cubic-bezier(.2,.8,.4,1) forwards;}
/* Ranking */
.rank-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.rank-title{font-size:22px;font-weight:900;color:#fff}
.rank-subtitle{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:1rem;font-weight:600}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-size:22px;min-width:38px;text-align:center}
.rank-name{flex:1;font-size:15px;font-weight:800;color:#fff}
.rank-name.me{color:#fdcb6e}
.rank-sub{font-size:12px;color:rgba(255,255,255,.4);font-weight:600}
.rank-score{font-size:17px;font-weight:900;color:#fdcb6e}
.rank-empty{text-align:center;padding:2.5rem;color:rgba(255,255,255,.3);font-size:14px}

/* Animations */
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ── RESPONSIVE ───────────────────────────────────────────────── */
@media(max-width:600px){
  body{padding:.5rem}
  #app{max-width:100%}
  .hero{padding:1.25rem 0 1rem}
  .hero-logo{width:72px;height:72px}
  .hero h1{font-size:18px}
  .hero .subtitle{font-size:14px}
  .card{padding:1rem}
  .card-dark{padding:1rem}
  .top-bar{flex-wrap:wrap;gap:8px}
  .user-chip{padding:5px 10px 5px 6px}
  .user-name{font-size:13px}
  .pills{gap:4px}
  .pill{padding:5px 10px;font-size:12px}
  .options,.tf-options,.topic-grid,.stats-row,.math-options,.lever-buttons{grid-template-columns:1fr}
  .opt{padding:13px 12px;font-size:13px}
  .tf-btn{padding:18px;font-size:16px}
  .match-wrap{grid-template-columns:1fr 1fr}
  .match-item{padding:8px 10px;font-size:13px}
  .q-text{font-size:15px}
  .game-hud{flex-wrap:wrap;gap:6px}
  .hud-score{font-size:13px;padding:4px 12px}
  .result-score{font-size:46px}
  .result-emoji{font-size:56px}
  .rank-title{font-size:18px}
  .rank-pos{font-size:18px;min-width:30px}
  .rank-name{font-size:14px}
  .rank-score{font-size:15px}
  .btn{font-size:14px;padding:13px}
  .math-problem{font-size:17px}
  .math-opt{font-size:16px;padding:13px}
  .blank-input{min-width:60px;font-size:14px}
  .fillblank-wrap{font-size:15px}
  .lever-emoji{font-size:44px}
  .lever-btn{padding:15px;font-size:15px}
  .tab{padding:8px;font-size:13px}
}

.burst-piece {
  position: absolute;
  pointer-events: none;
  z-index: 999;
  animation: burst var(--dur) ease-out var(--del) forwards;
  opacity: 0;
}

.confetti-paper {
  border-radius: 2px;
  /* Animación extra para que el papel gire mientras vuela */
  animation: burst var(--dur) ease-out var(--del) forwards, 
             spin 1s linear infinite;
}

@keyframes burst {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
  }
  15% {
    transform: translate(-50%, -50%) scale(1.2);
    opacity: 1;
  }
  100% {
    /* Mueve la pieza hacia su destino --tx y --ty */
    transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.5);
    opacity: 0;
  }
}

@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* El contenedor vuela hacia afuera */
.burst-container {
  position: absolute; /* Crucial: lo saca del flujo de texto */
  pointer-events: none;
  z-index: 9999; /* Asegura que esté por encima de todo */
  
  /* Forzamos que el "centro" del span esté donde le digamos por JS */
  display: block;
  width: 0;
  height: 0;
  
  animation: rain var(--dur) ease-in var(--del) forwards;
}

.burst-emoji, .burst-paper {
  position: absolute;
  /* Centramos el contenido dentro del contenedor que vuela */
  transform: translate(-50%, -50%); 
  animation: spin 1s linear infinite;
}

.burst-paper {
  border-radius: 2px;
}

/* --- Animación de Lluvia Expansiva --- */
@keyframes rain {
  0% {
    /* Nacen fuera de vista (cy es -150px) y sin dispersión todavía */
    transform: translate(0, 0) scale(0);
    opacity: 0;
  }
  /* Entran en la pantalla ya expandiéndose */
  10% {
    opacity: 1;
    transform: translate(calc(var(--tx) * 0.1), 100px) scale(1);
  }
  /* Al final, han cubierto el ancho y el alto */
  100% {
    /* Trayectoria: se mueve desde 0,0 (cx, cy) hacia las variables finales */
    transform: translate(var(--tx), var(--gravity)) scale(0.8);
    opacity: 0;
  }
}


@keyframes burst {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  /* Trayectoria: se mueve desde 0,0 (que es cx, cy) hacia las variables */
  100% {
    transform: translate(calc(-50% + var(--tx)), var(--gravity)) scale(0.7) rotate(15deg);
    opacity: 0;
  }
}

@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

#app {
  position: relative;
  overflow: hidden; /* Evita que el confeti cree barras de scroll al caer */
}
</style>
</head>

    <div class="top-bar">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">A</div>
        <span class="user-name" id="t-username"></span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Salir</button>
    </div>
    <div class="card-dark">
      <div class="filter-label">Curso</div>
      <div class="pills" id="f-curso"></div>
      <div class="filter-label">Asignatura</div>
      <div class="pills" id="f-asig"></div>
    </div>
    <div id="topic-list"><div class="spinner-wrap"><div class="spinner"></div></div></div>
  </div>

  <!-- GAME -->
  <div id="s-game" class="screen">
    <div class="game-hud">
      <span class="hud-progress" id="g-progress"></span>
      <span class="hud-score" id="g-score-live">0 pts</span>
    </div>
    <div class="timer-wrap">
      <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <div class="timer-secs" id="timer-secs">30s</div>
    </div>
    <div class="q-card" id="q-card">
      <!-- filled dynamically -->
    </div>
  </div>

  <!-- RESULT -->
  <div id="s-result" class="screen">
    <div class="result-wrap">
      <div class="result-hero">
        <span class="result-emoji" id="r-emoji">🎉</span>
        <span class="result-score" id="r-score"></span>
        <span class="result-label" id="r-correct"></span>
      </div>
      <div class="stats-row">
        <div class="stat-box"><span class="stat-val" id="r-best">—</span><span class="stat-lbl">🏆 Tu mejor marca</span></div>
        <div class="stat-box"><span class="stat-val" id="r-games">0</span><span class="stat-lbl">🎮 Partidas jugadas</span></div>
      </div>
      <button class="btn btn-primary" onclick="replayGame()">🔄 Jugar otra vez</button>
      <button class="btn btn-ghost" onclick="showRanking()" style="margin-top:8px">🏆 Ver ranking</button>
      <button class="btn btn-ghost" onclick="showTopics()" style="margin-top:8px">📚 Cambiar tema</button>
    </div>
  </div>

  <!-- RANKING -->
  <div id="s-ranking" class="screen">
    <div class="rank-header">
      <span class="rank-title">Ranking 🏆</span>
      <button class="btn btn-ghost btn-sm" onclick="showScreen('s-result')">Volver</button>
    </div>
    <div class="rank-subtitle" id="rank-topic-name"></div>
    <div class="card-dark"><div id="rank-list"><div class="spinner-wrap"><div class="spinner"></div></div></div></div>
  </div>

</div>
<script>
const API='api.php';

// ── BRANDING ─────────────────────────────────────────────────────
(function loadBranding(){
  fetch('branding.json').then(r=>r.json()).then(b=>{
    if(b.logo){
      const imgs=document.querySelectorAll('.branding-logo');
      imgs.forEach(img=>{img.src=b.logo;img.alt=b.nombre||'Logo';});
    }
    if(b.nombre){
      document.querySelectorAll('.branding-nombre').forEach(el=>el.textContent=b.nombre);
      document.title=(b.nombre||'Quiz Escolar')+' — '+(b.subtitulo||'Quiz Escolar');
    }
    if(b.subtitulo) document.querySelectorAll('.branding-subtitulo').forEach(el=>el.textContent=b.subtitulo);
    if(b.tagline)   document.querySelectorAll('.branding-tagline').forEach(el=>el.textContent=b.tagline);
  }).catch(()=>{});
})();
const CURSOS=['1º Primaria','2º Primaria','3º Primaria','4º Primaria','5º Primaria','6º Primaria'];
const ASIGS=['Ciencias Naturales','Ciencias Sociales','Lengua','Matemáticas','Inglés'];
const TYPE_LABELS={mcq:'4 opciones',truefalse:'Verdadero/Falso',match:'Unir con flechas',order:'Ordenar',math:'Cálculo',hotspot:'Señalar imagen',audio:'Escuchar audio',fillblank:'Completar',lever:'Sí / No'};
const TYPE_TIMES={mcq:25,truefalse:20,match:45,order:40,math:35,hotspot:30,audio:40,fillblank:35,lever:25};

let currentUser=null,userScores={},allTopics={},filterCurso='Todos',filterAsig='Todas';
let currentTopicId=null,currentTopicData=null;
let gameQ=[],qIdx=0,score=0,correctCount=0;
let timerInterval=null,timeLeft=20,answered=false;

// ── API ───────────────────────────────────────────────────────────
async function api(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  return r.json();
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showTab(t){
  document.getElementById('tab-login').classList.toggle('active',t==='login');
  document.getElementById('tab-register').classList.toggle('active',t==='register');
  document.getElementById('form-login').style.display=t==='login'?'block':'none';
  document.getElementById('form-register').style.display=t==='register'?'block':'none';
  document.getElementById('l-err').textContent='';document.getElementById('r-err').textContent='';
}

// ── AUTH ──────────────────────────────────────────────────────────
async function doLogin(){
  const u=document.getElementById('l-user').value.trim(),p=document.getElementById('l-pass').value;
  if(!u||!p){document.getElementById('l-err').textContent='Rellena todos los campos.';return;}
  const btn=document.getElementById('btn-login');btn.disabled=true;btn.textContent='Entrando...';
  const r=await api('login',{username:u,password:p});
  btn.disabled=false;btn.textContent='¡Entrar a jugar! ▶';
  if(!r.ok){document.getElementById('l-err').textContent=r.msg;return;}
  currentUser=u;userScores=r.scores||{};
  await loadTopics();showTopics();
}
async function doRegister(){
  const u=document.getElementById('r-user').value.trim(),p=document.getElementById('r-pass').value,p2=document.getElementById('r-pass2').value;
  if(!u||!p||!p2){document.getElementById('r-err').textContent='Rellena todos los campos.';return;}
  if(p!==p2){document.getElementById('r-err').textContent='Las contraseñas no coinciden.';return;}
  const btn=document.getElementById('btn-register');btn.disabled=true;btn.textContent='Creando...';
  const r=await api('register',{username:u,password:p});
  btn.disabled=false;btn.textContent='¡Crear mi cuenta! 🎉';
  if(!r.ok){document.getElementById('r-err').textContent=r.msg;return;}
  currentUser=u;userScores={};
  await loadTopics();showTopics();
}
function doLogout(){currentUser=null;userScores={};allTopics={};showTab('login');showScreen('s-login');}

// ── TOPICS ────────────────────────────────────────────────────────
async function loadTopics(){const r=await api('get_topics');allTopics=r.ok?r.topics:{};}
function showTopics(){
  document.getElementById('t-username').textContent=currentUser;
  const av=document.getElementById('user-avatar');if(av)av.textContent=currentUser.charAt(0).toUpperCase();
  renderFilters();renderTopics();showScreen('s-topics');
}
function renderFilters(){
  const cp=new Set(Object.values(allTopics).map(t=>t.curso));
  const ap=new Set(Object.values(allTopics).map(t=>t.asignatura));
  document.getElementById('f-curso').innerHTML=['Todos',...CURSOS.filter(c=>cp.has(c))].map(c=>`<button class="pill${filterCurso===c?' active':''}" onclick="setCurso('${c}')">${c}</button>`).join('');
  document.getElementById('f-asig').innerHTML=['Todas',...ASIGS.filter(a=>ap.has(a))].map(a=>`<button class="pill${filterAsig===a?' active':''}" onclick="setAsig('${a}')">${a}</button>`).join('');
}
function setCurso(c){filterCurso=c;renderFilters();renderTopics();}
function setAsig(a){filterAsig=a;renderFilters();renderTopics();}
function renderTopics(){
  const tl=document.getElementById('topic-list');
  const filtered=Object.entries(allTopics).filter(([,t])=>(filterCurso==='Todos'||t.curso===filterCurso)&&(filterAsig==='Todas'||t.asignatura===filterAsig));
  if(!filtered.length){tl.innerHTML='<div class="no-topics">😕 No hay temas con estos filtros.</div>';return;}
  const groups={};
  filtered.forEach(([tid,t])=>{const k=t.curso+'|'+t.asignatura;if(!groups[k])groups[k]={curso:t.curso,asig:t.asignatura,items:[]};groups[k].items.push([tid,t]);});
  let html='';
  for(const k of Object.keys(groups)){
    const g=groups[k];
    html+=`<div style="margin-bottom:1.25rem"><div class="topic-section-title">${g.curso} · ${g.asig}</div><div class="topic-grid">`;
    g.items.forEach(([tid,t])=>{
      const sc=userScores[tid];
      html+=`<div class="topic-card" onclick="selectTopic('${tid}')">
        <div class="tc-num">${t.q_count} preguntas</div>
        <div class="tc-name">${t.tema}</div>
        ${sc?`<div class="tc-score">⭐ ${sc.best} pts</div><div class="tc-qs">${sc.games} partidas</div>`:'<div class="tc-qs">¡Sin jugar aún!</div>'}
      </div>`;
    });
    html+='</div></div>';
  }
  tl.innerHTML=html;
}

// ── GAME ENGINE ───────────────────────────────────────────────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

async function selectTopic(tid){
  currentTopicId=tid;
  const r=await api('get_questions',{topic_id:tid});
  if(!r.ok||!r.questions||!r.questions.length){alert('Este tema no tiene preguntas aún.');return;}
  currentTopicData=r.questions;startGame();
}
function startGame(){
  gameQ=shuffle([...currentTopicData]);
  qIdx=0;score=0;correctCount=0;
  showScreen('s-game');showQuestion();
}
function replayGame(){startGame();}

function showQuestion(){
  clearInterval(timerInterval);answered=false;
  const q=gameQ[qIdx];
  document.getElementById('g-progress').textContent='Pregunta '+(qIdx+1)+' de '+gameQ.length;
  document.getElementById('g-score-live').textContent=score+' pts';
  const seconds=(q.time>0?q.time:null)||TYPE_TIMES[q.type]||30;
  timeLeft=seconds;
  const tf=document.getElementById('timer-fill');
  tf.style.width='100%';tf.className='timer-fill';
  document.getElementById('timer-secs').textContent=seconds+'s';
  // Render question
  renderQuestion(q);
  timerInterval=setInterval(()=>{
    timeLeft-=.1;const pct=Math.max(0,(timeLeft/seconds)*100);
    tf.style.width=pct+'%';
    if(timeLeft<7)tf.className='timer-fill warning';
    document.getElementById('timer-secs').textContent=Math.ceil(timeLeft)+'s';
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)timeUp();}
  },100);
}

function timeUp(){
  answered=true;
  const q=gameQ[qIdx];
  showFeedback(false,'⏱️ ¡Tiempo! '+getCorrectText(q));
  disableQuestion();
  setTimeout(nextQuestion,2200);
}

function getCorrectText(q){
  switch(q.type){
    case 'mcq': return 'Respuesta correcta: '+q.opts[q.a];
    case 'truefalse': return 'La respuesta era: '+(q.a?'Verdadero':'Falso');
    case 'math': return 'Resultado correcto: '+q.result;
    case 'lever': return 'La respuesta era: '+(q.a?'Sí':'No');
    default: return '';
  }
}

function renderQuestion(q){
  const card=document.getElementById('q-card');
  const type=q.type||'mcq';
  const label=TYPE_LABELS[type]||type;
  let html=`<div class="q-type-badge">${label}</div>`;
  html+=`<div class="q-text">${q.q}</div>`;
  if(q.img && q.type!=='hotspot') html+=`<img class="q-img" src="${q.img}" alt=""/>`;
  html+=renderQuestionBody(q);
  html+=`<div class="feedback" id="q-feedback"></div>`;
  card.innerHTML=html;
  postRenderSetup(q);
}

function renderQuestionBody(q){
  const type=q.type||'mcq';
  switch(type){
    case 'mcq': return renderMCQ(q);
    case 'truefalse': return renderTF(q);
    case 'match': return renderMatch(q);
    case 'order': return renderOrder(q);
    case 'math': return renderMath(q);
    case 'hotspot': return renderHotspot(q);
    case 'audio': return renderAudio(q);
    case 'fillblank': return renderFillBlank(q);
    case 'lever': return renderLever(q);
    default: return renderMCQ(q);
  }
}

// ── MCQ ───────────────────────────────────────────────────────────
let mcqShuffled=[];
function renderMCQ(q){
  const colors=['opt-a','opt-b','opt-c','opt-d'];
  const indexed=q.opts.map((text,i)=>({text,i}));
  for(let n=indexed.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[indexed[n],indexed[j]]=[indexed[j],indexed[n]];}
  mcqShuffled=indexed;
  return`<div class="options">${indexed.map((o,pos)=>`<button class="opt ${colors[pos]}" onclick="answerMCQ(${pos})">${o.text}</button>`).join('')}</div>`;
}
function answerMCQ(chosen){
  if(answered)return;answered=true;clearInterval(timerInterval);
  const q=gameQ[qIdx];
  const correctPos=mcqShuffled.findIndex(o=>o.i===q.a);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(mcqShuffled[chosen].i===q.a){
    const pts=calcPts();score+=pts;correctCount++;
    document.querySelectorAll('.opt')[chosen].classList.add('correct');
    snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Correcto! +'+pts+' puntos');
  }else{
    document.querySelectorAll('.opt')[chosen].classList.add('wrong');
    document.querySelectorAll('.opt')[correctPos].classList.add('correct');
    snd('snd-ko');showFeedback(false,'❌ Incorrecto. Respuesta: '+q.opts[q.a]);
  }
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2200);
}

// ── TRUE/FALSE ────────────────────────────────────────────────────
function renderTF(q){
  return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:.5rem">
    <button class="tf-btn" style="background:linear-gradient(135deg,#00b894,#00cec9)" onclick="answerTF(true)">✅ Verdadero</button>
    <button class="tf-btn" style="background:linear-gradient(135deg,#d63031,#e17055)" onclick="answerTF(false)">❌ Falso</button>
  </div>`;
}

function answerTF(val){
  if(answered)return;answered=true;clearInterval(timerInterval);
  const q=gameQ[qIdx];const correct=q.a===true||q.a===1||q.a==='true';
  const btns=document.querySelectorAll('.tf-btn');
  const trueBtn=btns[0],falseBtn=btns[1];
  if(val===correct){
    const pts=calcPts();score+=pts;correctCount++;
    (val?trueBtn:falseBtn).classList.add('correct');
    snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Correcto! +'+pts+' puntos');
  }else{
    (val?trueBtn:falseBtn).classList.add('wrong');
    (correct?trueBtn:falseBtn).classList.add('correct');
    snd('snd-ko');showFeedback(false,'❌ La respuesta era: '+(correct?'Verdadero':'Falso'));
  }
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2200);
}

// ── MATCH ─────────────────────────────────────────────────────────
function renderMatch(q){
  // q.pairs = [{left:'...', right:'...'}]
  // shuffledRight keeps the original index so we can check correctness
  const shuffledRight=shuffle([...q.pairs.map((p,i)=>({text:p.right,origIdx:i}))]);
  let html=`<div class="match-wrap">
    <div class="match-cols">
      <div class="match-col" id="match-left">`;
  q.pairs.forEach((p,i)=>{ html+=`<div class="match-item" id="ml-${i}" onclick="selectLeft(${i})">${p.left}</div>`; });
  html+=`</div>
      <div class="match-svg-col" id="match-svg-col"><svg id="match-svg"></svg></div>
      <div class="match-col" id="match-right">`;
  // visIdx = visual position (0,1,2…), origIdx = original pair index
  shuffledRight.forEach((p,visIdx)=>{ html+=`<div class="match-item" id="mr-${p.origIdx}" data-orig="${p.origIdx}" onclick="selectRight(${p.origIdx})">${p.text}</div>`; });
  html+=`</div>
    </div>
  </div>`;
  return html;
}

let matchSelectedLeft=null;
function postRenderSetup(q){
  matchSelectedLeft=null;
  matchMatched=new Set();matchErrors=0;matchArrows=[];
  if(q.type==='order') setupDragDrop();
  if(q.type==='match') requestAnimationFrame(()=>requestAnimationFrame(initMatchSVG));
}

let matchMatched=new Set(),matchErrors=0,matchArrows=[];

function initMatchSVG(){
  // Size the SVG col to match the height of the taller column
  const leftCol=document.getElementById('match-left');
  const rightCol=document.getElementById('match-right');
  const svgCol=document.getElementById('match-svg-col');
  if(!leftCol||!svgCol) return;
  const h=Math.max(leftCol.offsetHeight, rightCol?.offsetHeight||0);
  svgCol.style.height=h+'px';
  const svg=document.getElementById('match-svg');
  if(svg){ svg.style.height=h+'px'; }
  // Add arrowhead marker definition
  const ns='http://www.w3.org/2000/svg';
  const defs=document.createElementNS(ns,'defs');
  ['ok','err','sel'].forEach(id=>{
    const marker=document.createElementNS(ns,'marker');
    marker.setAttribute('id','arrow-'+id);
    marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');
    marker.setAttribute('refX','6');marker.setAttribute('refY','3');
    marker.setAttribute('orient','auto');
    const path=document.createElementNS(ns,'path');
    path.setAttribute('d','M0,0 L0,6 L8,3 z');
    const color=id==='ok'?'#00b894':id==='err'?'#d63031':'#6C5CE7';
    path.setAttribute('fill',color);
    marker.appendChild(path);defs.appendChild(marker);
  });
  if(svg) svg.appendChild(defs);
}

function getItemCenter(el, relativeTo){
  // Returns {x,y} center of el relative to relativeTo's bounding box
  const eRect=el.getBoundingClientRect();
  const rRect=relativeTo.getBoundingClientRect();
  return{
    x: eRect.left-rRect.left + eRect.width/2,
    y: eRect.top -rRect.top  + eRect.height/2
  };
}

function drawMatchArrows(){
  const svg=document.getElementById('match-svg');
  const svgCol=document.getElementById('match-svg-col');
  if(!svg||!svgCol) return;
  // Remove old lines (keep defs)
  [...svg.children].forEach(c=>{ if(c.tagName!=='defs') c.remove(); });
  const ns='http://www.w3.org/2000/svg';
  // Resize SVG height in case items shifted
  svg.style.height=svgCol.offsetHeight+'px';
  matchArrows.forEach(a=>{
    const lEl=document.getElementById('ml-'+a.left);
    const rEl=document.getElementById('mr-'+a.right);
    if(!lEl||!rEl) return;
    const lRect=lEl.getBoundingClientRect();
    const rRect=rEl.getBoundingClientRect();
    const colRect=svgCol.getBoundingClientRect();
    const x1=lRect.right - colRect.left;
    const y1=lRect.top - colRect.top + lRect.height/2;
    const x2=rRect.left - colRect.left;
    const y2=rRect.top - colRect.top + rRect.height/2;
    const color=a.ok?'#00b894':a.ok===false?'#d63031':'#6C5CE7';
    const markerId=a.ok?'arrow-ok':a.ok===false?'arrow-err':'arrow-sel';
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke',color);
    line.setAttribute('stroke-width', a.ok===null?'2.5':'2');
    line.setAttribute('stroke-dasharray', a.ok===null?'5,3':'none');
    line.setAttribute('marker-end','url(#'+markerId+')');
    svg.appendChild(line);
  });
}

function selectLeft(i){
  if(matchMatched.has('l'+i)) return;
  // Si pulsamos el mismo, deseleccionar
  if(matchSelectedLeft===i){
    matchSelectedLeft=null;
    document.getElementById('ml-'+i).classList.remove('selected');
    matchArrows=matchArrows.filter(a=>a.ok!==null);
    drawMatchArrows();
    return;
  }
  matchArrows=matchArrows.filter(a=>a.ok!==null);
  document.querySelectorAll('#match-left .match-item').forEach(el=>el.classList.remove('selected'));
  matchSelectedLeft=i;
  document.getElementById('ml-'+i).classList.add('selected');
  drawMatchArrows();
}

function selectRight(j){
  if(matchMatched.has('r'+j)) return;
  if(matchSelectedLeft===null) return;
  const q=gameQ[qIdx];
  const correct=matchSelectedLeft===j;
  const lEl=document.getElementById('ml-'+matchSelectedLeft);
  const rEl=document.getElementById('mr-'+j);
  if(correct){
    lEl.classList.remove('selected');
    lEl.classList.add('matched-ok','disabled');
    rEl.classList.add('matched-ok','disabled');
    matchMatched.add('l'+matchSelectedLeft);
    matchMatched.add('r'+j);
    matchArrows.push({left:matchSelectedLeft, right:j, ok:true});
    matchSelectedLeft=null;
    drawMatchArrows();
    if(matchMatched.size===q.pairs.length*2){
      answered=true;clearInterval(timerInterval);
      const pts=Math.max(10,calcPts()-matchErrors*30);
      score+=pts;correctCount++;
      snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Todo correcto! +'+pts+' puntos');
      document.getElementById('g-score-live').textContent=score+' pts';
      setTimeout(nextQuestion,2200);
    }
  }else{
    matchErrors++;
    lEl.classList.remove('selected');
    lEl.classList.add('matched-err');
    rEl.classList.add('matched-err');
    // Draw a brief error arrow then remove it
    matchArrows.push({left:matchSelectedLeft, right:j, ok:false});
    drawMatchArrows();
    setTimeout(()=>{
      lEl.classList.remove('matched-err');
      rEl.classList.remove('matched-err');
      matchArrows=matchArrows.filter(a=>a.ok!==false);
      drawMatchArrows();
    },700);
    matchSelectedLeft=null;
  }
}

// ── ORDER ─────────────────────────────────────────────────────────
function renderOrder(q){
  const shuffled=shuffle([...q.items]);
  let html=`<ul class="order-list" id="order-list">`;
  shuffled.forEach((item,i)=>{ html+=`<li class="order-item" draggable="true" data-idx="${i}" data-text="${item.replace(/"/g,'&quot;')}"><span class="order-handle">⠿</span>${item}</li>`; });
  html+=`</ul><button class="btn-check-order" onclick="checkOrder()">Comprobar orden ✓</button>`;
  return html;
}
let dragSrc=null;
function setupDragDrop(){
  const list=document.getElementById('order-list');
  if(!list)return;
  list.addEventListener('dragstart',e=>{dragSrc=e.target.closest('.order-item');dragSrc.classList.add('dragging');});
  list.addEventListener('dragend',e=>{e.target.closest('.order-item')?.classList.remove('dragging');});
  list.addEventListener('dragover',e=>{
    e.preventDefault();
    const over=e.target.closest('.order-item');
    if(over&&over!==dragSrc){
      list.querySelectorAll('.order-item').forEach(el=>el.classList.remove('drag-over'));
      over.classList.add('drag-over');
    }
  });
  list.addEventListener('drop',e=>{
    e.preventDefault();
    const over=e.target.closest('.order-item');
    if(over&&over!==dragSrc){
      over.classList.remove('drag-over');
      const items=[...list.querySelectorAll('.order-item')];
      const srcIdx=items.indexOf(dragSrc);const overIdx=items.indexOf(over);
      if(srcIdx<overIdx) over.after(dragSrc); else over.before(dragSrc);
    }
  });
  // Touch support
  let touchItem=null,touchClone=null;
  list.addEventListener('touchstart',e=>{
    touchItem=e.target.closest('.order-item');
    if(!touchItem)return;
    touchItem.classList.add('dragging');
  },{passive:true});
  list.addEventListener('touchmove',e=>{
    if(!touchItem)return;e.preventDefault();
    const touch=e.touches[0];
    const over=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.order-item');
    list.querySelectorAll('.order-item').forEach(el=>el.classList.remove('drag-over'));
    if(over&&over!==touchItem) over.classList.add('drag-over');
  },{passive:false});
  list.addEventListener('touchend',e=>{
    if(!touchItem)return;
    touchItem.classList.remove('dragging');
    const over=list.querySelector('.drag-over');
    if(over){over.classList.remove('drag-over');over.before(touchItem);}
    touchItem=null;
  });
}
function checkOrder(){
  if(answered)return;
  const q=gameQ[qIdx];
  const list=document.getElementById('order-list');
  const items=[...list.querySelectorAll('.order-item')].map(el=>el.dataset.text);
  const allCorrect=items.every((text,i)=>text===q.items[i]);
  answered=true;clearInterval(timerInterval);
  document.querySelector('.btn-check-order').disabled=true;
  if(allCorrect){
    list.querySelectorAll('.order-item').forEach(el=>el.classList.add('correct'));
    const pts=calcPts();score+=pts;correctCount++;
    snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Orden correcto! +'+pts+' puntos');
  }else{
    items.forEach((text,i)=>{
      const el=list.querySelectorAll('.order-item')[i];
      el.classList.add(text===q.items[i]?'correct':'wrong');
    });
    showFeedback(false,'❌ El orden correcto era: '+q.items.join(' → '));
  }
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2500);
}

// ── MATH ──────────────────────────────────────────────────────────
function renderMath(q) {
  // Filtramos las opciones para eliminar vacíos, espacios, null o undefined
  const validOpts = q.opts ? q.opts.filter(o => String(o).trim() !== "") : [];
  
  let html = `<div class="math-problem">${q.problem || q.q}</div>`;

  // Ahora comprobamos el array filtrado
  if (validOpts.length > 0) {
    html += `<div class="math-options">
      ${validOpts.map((o, i) => `<button class="math-opt" onclick="answerMath(${i}, ${o})">${o}</button>`).join('')}
    </div>`;
  } else {
    // Si no hay opciones válidas, mostramos el input
    html += `<div class="math-options" style="display:flex; flex-direction:column; gap:10px;">
      <input type="number" id="manual-answer" class="math-input" step="any" 
             placeholder="Escribe el resultado..." 
             oninput="document.getElementById('send-btn').disabled = (this.value.trim() === '')">
      <button id="send-btn" class="math-opt" disabled 
              onclick="answerMath(-1, document.getElementById('manual-answer').value)">
        Comprobar
      </button>
    </div>`;
  }
  return html;
}

function answerMath(idx, val) {
  if (answered) return;
  
  const q = gameQ[qIdx];
  // Convertimos a número ambos valores para comparar "valor real"
  const userVal = parseFloat(val);
  const correctVal = parseFloat(q.result);

  // La validación ahora es numérica:
  const correct = !isNaN(userVal) && userVal === correctVal;

  answered = true;
  clearInterval(timerInterval);

  // Desactivamos todo para evitar doble clic
  document.querySelectorAll('.math-opt').forEach(b => b.disabled = true);
  const input = document.getElementById('manual-answer');
  if (input) input.disabled = true;

  if (correct) {
    const pts = calcPts(); score += pts; correctCount++;
    
    if (idx >= 0) {
      document.querySelectorAll('.math-opt')[idx].classList.add('correct');
    } else {
      input.classList.add('correct-input'); // Clase opcional para el input
    }
    
    snd('snd-ok'); launchConfetti(false);
    showFeedback(true, '✅ ¡Correcto! +' + pts + ' puntos');
  } else {
    // Si falló, marcamos el error
    if (idx >= 0) {
      document.querySelectorAll('.math-opt')[idx].classList.add('wrong');
    } else if (input) {
      input.classList.add('wrong-input');
    }

    // Mostrar respuesta correcta en los botones (si existen)
    document.querySelectorAll('.math-opt').forEach(b => {
      if (parseFloat(b.textContent.trim()) === correctVal) b.classList.add('correct');
    });

    snd('snd-ko');
    showFeedback(false, '❌ Incorrecto. El resultado era ' + q.result);
  }

  document.getElementById('g-score-live').textContent = score + ' pts';
  setTimeout(nextQuestion, 2200);
}

// ── HOTSPOT ───────────────────────────────────────────────────────
function renderHotspot(q){
  // q.img required, q.zone = {x:50, y:50, r:15} (percentages)
  return`<div class="hotspot-wrap" id="hotspot-wrap">
    <img src="${q.img}" alt="" id="hotspot-img" style="width:100%;border-radius:var(--rads);display:block"/>
    <div class="hotspot-overlay" id="hotspot-overlay" onclick="answerHotspot(event)"></div>
    <div class="hotspot-target" id="hotspot-target"></div>
  </div>
  <p style="font-size:13px;color:var(--muted);text-align:center;margin-top:8px">👆 Pulsa en la imagen donde corresponda</p>`;
}
function answerHotspot(e) {
  if (answered) return;
  const q = gameQ[qIdx];
  const wrap = document.getElementById('hotspot-wrap');
  const rect = wrap.getBoundingClientRect();

  // 1. Obtenemos las coordenadas en PÍXELES reales respecto al contenedor
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  // 2. Convertimos el centro del objetivo (Z.x, Z.y) de % a PÍXELES
  const targetX = (q.zone.x / 100) * rect.width;
  const targetY = (q.zone.y / 100) * rect.height;

  // 3. El radio es el truco: si queremos que visualmente sea un círculo, 
  // el radio en píxeles debe basarse en UNA sola dimensión (ej. el ancho)
  const radiusPx = (q.zone.r / 100) * rect.width;

  // 4. Calculamos la distancia real en píxeles
  const dist = Math.sqrt(Math.pow(clickX - targetX, 2) + Math.pow(clickY - targetY, 2));
  const correct = dist <= radiusPx;

  answered = true;
  clearInterval(timerInterval);

  // --- Visualización ---
  const px = (clickX / rect.width) * 100;
  const py = (clickY / rect.height) * 100;

  const dot = document.createElement('div');
  dot.className = 'hotspot-click ' + (correct ? 'ok' : 'ko');
  dot.style.left = px + '%';
  dot.style.top = py + '%';
  wrap.appendChild(dot);

  const target = document.getElementById('hotspot-target');
  target.style.display = 'block';
  target.style.left = q.zone.x + '%';
  target.style.top = q.zone.y + '%';
  
  // IMPORTANTE: Para que el CSS dibuje un círculo perfecto:
  // Usamos el ancho en píxeles para ambas dimensiones o usamos aspect-ratio
  const diameterPx = radiusPx * 2;
  target.style.width = diameterPx + 'px';
  target.style.height = diameterPx + 'px';
  target.style.transform = 'translate(-50%, -50%)';
  document.getElementById('hotspot-overlay').style.cursor='default';
  if(correct){const pts=calcPts();score+=pts;correctCount++;snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Bien señalado! +'+pts+' puntos');}
  else{showFeedback(false,'❌ No era ahí. La zona correcta está marcada.');}
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2500);
}

// ── AUDIO ─────────────────────────────────────────────────────────
function renderAudio(q){
  // q.audio = base64 or URL, q.opts for MCQ after listening
  let html=`<div class="audio-wrap">`;
  if(q.audio) html+=`<audio controls class="audio-player" src="${q.audio}"></audio>`;

// ── FILL BLANK ────────────────────────────────────────────────────
function renderFillBlank(q){
  // q.q = instrucción, q.sentence = frase con ___ , q.blanks = ['respuesta',...]
  // Si no hay sentence separada, usar q.q directamente como frase con huecos
  const sentence = q.sentence || q.q || '';
  let idx=0;
  const withInputs = sentence.replace(/_{2,}/g, ()=>
    `<input type="text" class="blank-input" id="blank-${idx++}" placeholder="..." autocomplete="off" autocorrect="off" spellcheck="false"/>`
  );
  // Si hay sentence y q.q distintos, mostrar q.q como instrucción encima
  const instruction = (q.sentence && q.q && q.q !== q.sentence)
    ? `<p style="font-size:14px;color:var(--muted);margin-bottom:.75rem">${q.q}</p>`
    : '';
  return`${instruction}<div class="fillblank-wrap">${withInputs}</div>
  <button class="btn-check-fill" onclick="checkFillBlank()">Comprobar ✓</button>`;
}
function checkFillBlank(){
  if(answered)return;
  const q=gameQ[qIdx];
  const blanks=q.blanks||[];
  let allOk=true;
  blanks.forEach((expected,i)=>{
    const el=document.getElementById('blank-'+i);
    if(!el)return;
    const val=el.value.trim().toLowerCase();
    const exp=(Array.isArray(expected)?expected:[expected]).map(s=>s.toLowerCase());
    if(exp.includes(val)){el.classList.add('correct');}
    else{el.classList.add('wrong');allOk=false;}
    el.disabled=true;
  });
  answered=true;clearInterval(timerInterval);
  document.querySelector('.btn-check-fill').disabled=true;
  if(allOk){const pts=calcPts();score+=pts;correctCount++;snd('snd-ok');launchConfetti(false);showFeedback(true,'✅ ¡Correcto! +'+pts+' puntos');}
  else{
    const answers=blanks.map(b=>Array.isArray(b)?b[0]:b).join(', ');
    showFeedback(false,'❌ Respuesta(s) correcta(s): '+answers);
  }
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2500);
}

// ── LEVER ─────────────────────────────────────────────────────────
function renderLever(q){
  // q.context = descriptive situation, q.a = true/false (yes/no)
  return`<div class="lever-wrap">
    <div class="lever-context">${q.context||q.q}</div>
    <span class="lever-emoji">${q.emoji||'🤔'}</span>
    <div class="lever-buttons">
      <button class="lever-btn lever-yes" onclick="answerLever(true)">👍 Sí</button>
      <button class="lever-btn lever-no" onclick="answerLever(false)">👎 No</button>
    </div>
  </div>`;
}
function answerLever(val){
  if(answered)return;answered=true;clearInterval(timerInterval);
  const q=gameQ[qIdx];const correct=q.a===true||q.a===1||q.a==='true';
  document.querySelectorAll('.lever-btn').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.lever-btn');
  if(val===correct){
    const pts=calcPts();score+=pts;correctCount++;
    btns[val?0:1].classList.add('correct');
    snd('snd-ok');showFeedback(true,'✅ ¡Correcto! +'+pts+' puntos');
    launchConfetti(false);
  }else{
    btns[val?0:1].classList.add('wrong');
    btns[correct?0:1].classList.add('correct');
    snd('snd-ko');showFeedback(false,'❌ La respuesta era: '+(correct?'Sí':'No')+(q.explanation?' — '+q.explanation:''));
  }
  document.getElementById('g-score-live').textContent=score+' pts';
  setTimeout(nextQuestion,2200);
}

// -- SOUNDS --
function snd(id){ try{ var a=document.getElementById(id); a.currentTime=0; a.play(); }catch(e){} }

// -- BURST REWARD --
function launchConfetti(big) {
  const em = big ? ['🏆','🎉','🌟','✨','🥳','🎊','💥','👏','🎯'] : ['⭐','✨','🌟','👏','🎯','💫'];
  const colors = ['#FFC107', '#FF5722', '#E91E63', '#2196F3', '#4CAF50', '#9C27B0'];
  const count = big ? 300 : 150; // Número de piezas
  const app = document.getElementById('app');
  const rect = app.getBoundingClientRect();
  const cx = rect.width / 2;
  // Punto de inicio (centro de la pantalla o donde quieras)
  const cy = -120; //Math.min(window.innerHeight * 0.4, 280);

  for (let i = 0; i < count; i++) {
    // 1. Crear el contenedor (se encarga de volar hacia afuera)
    const container = document.createElement('span');
    container.className = 'burst-container';

    // 2. Crear el contenido (se encarga de girar y ser un emoji o papel)
    const content = document.createElement('div');
    const isEmoji = Math.random() > 0.5;
    
    if (isEmoji) {
      content.className = 'burst-emoji';
      content.textContent = em[Math.floor(Math.random() * em.length)];
      const size = big ? (30 + Math.random() * 20) : (20 + Math.random() * 15);
      content.style.fontSize = size + 'px';
    } else {
      content.className = 'burst-paper';
      content.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      const w = big ? (10 + Math.random() * 10) : (6 + Math.random() * 8);
      const h = big ? (15 + Math.random() * 10) : (10 + Math.random() * 8);
      content.style.width = w + 'px';
      content.style.height = h + 'px';
    }

    container.appendChild(content);

    // 3. Lógica de física y trayectoria
    const angle = Math.random() * Math.PI * 2;
    // Distancia de explosión (hacia afuera)
    const horizontalForce = big ? rect.width : rect.width * 0.7;
    const horizontalSpread = rect.width * 2.5; // 1.5 veces el ancho de la pantalla
    const explodeDist = big ? (150 + Math.random() * 100) : (100 + Math.random() * 50);
    const tx = (Math.random() - 0.5) * horizontalSpread; //Math.cos(angle) * explodeDist;
    
    // Altura del arco de explosión
    const explodeHeight = big ? -200 : -100;
    const ty = Math.sin(angle) * explodeHeight;
    
    // Gravedad (caerán hasta el fondo)
    const gravity = window.innerHeight + 200; //const gravity = big ? (window.innerHeight * 0.6) : (window.innerHeight * 0.4);

    const dur = (big ? (3.0 + Math.random() * 2) : (2.0 + Math.random() * 1.5)).toFixed(2);
    const del = (Math.random() * 0.5).toFixed(2);

    // Definir las variables CSS para la animación
    container.style.cssText = `
      left: ${cx}px;
      top: ${cy}px;
      --tx: ${tx}px;
      --ty: ${ty}px;
      --gravity: ${gravity}px;
      --dur: ${dur}s;
      --del: ${del}s;
    `;
    container.style.left = cx + 'px';
    container.style.top = cy + 'px';
    container.style.setProperty('--tx', tx + 'px');
    container.style.setProperty('--ty', ty + 'px'); // Si quieres usar el arco
    container.style.setProperty('--gravity', gravity + 'px');
    container.style.setProperty('--dur', dur + 's');
    container.style.setProperty('--del', del + 's');
    app.appendChild(container);

    // Limpieza
    setTimeout(() => container.remove(), (parseFloat(dur) + parseFloat(del)) * 1000);
  }
}

// ── HELPERS ───────────────────────────────────────────────────────
function calcPts(){
  const q=gameQ[qIdx];const maxTime=(q.time>0?q.time:null)||TYPE_TIMES[q.type||'mcq']||30;
  return Math.max(10,Math.round(100+(timeLeft/maxTime)*400));
}
function showFeedback(ok,msg){
  const fb=document.getElementById('q-feedback');
  if(fb){fb.textContent=msg;fb.className='feedback '+(ok?'ok':'ko');}
}
function disableQuestion(){
  document.querySelectorAll('.opt,.tf-btn,.math-opt,.lever-btn').forEach(b=>b.disabled=true);
}
function nextQuestion(){
  qIdx++;if(qIdx<gameQ.length)showQuestion();else endGame();
}

// ── END GAME ──────────────────────────────────────────────────────
async function endGame(){
  clearInterval(timerInterval);
  let best=score,games=1;
  if(currentUser!=='__preview__'){
    const r=await api('save_score',{username:currentUser,topic_id:currentTopicId,score});
    best=r.ok?r.best:score;games=r.ok?r.games:1;
  }
  const r={ok:true,best,games};
  if(!userScores[currentTopicId])userScores[currentTopicId]={best:0,games:0};
  userScores[currentTopicId]={best,games};
  document.getElementById('r-score').textContent=score+' pts';
  document.getElementById('r-correct').textContent=correctCount+' de '+gameQ.length+' correctas';
  document.getElementById('r-best').textContent=best+' pts';
  document.getElementById('r-games').textContent=games;
  const pct=correctCount/gameQ.length;
  document.getElementById('r-emoji').textContent=pct>=.8?'🏆':pct>=.6?'🎉':pct>=.4?'😊':'💪';
  snd('snd-win');launchConfetti(true);
  showScreen('s-result');
}
